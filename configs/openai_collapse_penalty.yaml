# Ablation: identical to openai_collapse.yaml but with a strong
# frequency_penalty to FIGHT repetition-collapse. Compare the drift
# trajectory against the no-penalty baseline.

fetcher_config:
  fetcher: "random"
  category: "conversational"

analyzer_config:
  analyzer: "similarity"
  analyze_window: 5

agent_configs:
  - provider: "openai"
    model: "gpt-4o-mini"
    system_prompt: "You are a helpful assistant participating in a conversation."
    temperature: 0.2
    max_tokens: 150
    frequency_penalty: 0.8    # <-- the only change vs openai_collapse.yaml
    presence_penalty: 0.0
    top_p: 1.0

agent_selection_method: "round_robin"

max_iterations: 60
max_total_characters: 1000000
output_dir: "results"
