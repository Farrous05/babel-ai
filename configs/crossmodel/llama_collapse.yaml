# CROSS-MODEL EVAL SET -- collapses from a model we NEVER train on.
#
# Purpose: our held-out set is also Qwen-3B collapses, so it cannot tell
# "learned looping" from "learned Qwen-3B's mannerisms". These Llama-3.2-3B (size-matched to the Qwen-3B subject)
# collapses are a second test set: if the <end> trigger fires here too, the
# model learned the PROPERTY; if it only fires on Qwen, it overfit.
#
# NEVER add these runs to training. Eval only.
#
# Same detector settings and iteration count as the 10k harvest so the two sets
# are directly comparable. Seeds come from the SAME pool (disjoint runs).

fetcher_config:
  fetcher: "sharegpt"
  data_path: "data/seeds_10k.json"
  min_messages: 1
  max_messages: 6

analyzer_config:
  analyzer: "similarity"
  analyze_window: 10

agent_configs:
  - provider: "ollama_company"
    model: "llama3.2:3b-instruct-fp16"
    system_prompt: "You are a helpful assistant participating in a conversation."
    temperature: 1.0
    max_tokens: 512
    frequency_penalty: 0.0
    presence_penalty: 0.0
    top_p: 1.0

agent_selection_method: "round_robin"

max_iterations: 28
max_total_characters: 1000000
output_dir: "/dais/fs/scratch/fash/results/crossmodel_llama"
