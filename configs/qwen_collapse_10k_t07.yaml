# 10k-harvest variant, temperature 0.7. One config per temperature: babel has no
# temp-override, and running an EQUAL split across 0.2/0.5/0.7/1.0 turns
# "how does temperature affect collapse onset?" into a measured result instead of
# a guess. (Current evidence is only 12 runs at t=0.2, which hinted LOWER temp
# collapses LATEST -- onset 14 vs 10. Worth confirming at scale.)
#
# max_iterations=24: the detector needs warmup(10)+persistence(3)=13 rounds just to
# DECLARE collapse, so a 15-turn run can never yield a late-collapse run -- and
# late-collapse runs are the ONLY source of deep healthy windows. 24 leaves room
# for onset up to ~21 plus the healthy lead-in we actually need.

fetcher_config:
  fetcher: "sharegpt"
  data_path: "data/seeds_10k.json"   # 10,000 real ShareGPT openings, coding capped 20.6%
  min_messages: 1        # curated seeds are pre-trimmed; some are a single human turn
  max_messages: 6

analyzer_config:
  analyzer: "similarity"
  analyze_window: 10

agent_configs:
  - provider: "ollama_company"
    model: "qwen2.5:3b-instruct-fp16"
    system_prompt: "You are a helpful assistant participating in a conversation."
    temperature: 0.7
    max_tokens: 512
    frequency_penalty: 0.0    # do NOT discourage repetition -- we WANT collapse
    presence_penalty: 0.0
    top_p: 1.0

agent_selection_method: "round_robin"

max_iterations: 24
max_total_characters: 1000000
output_dir: "/dais/fs/scratch/fash/results/qwen10k"   # scratch, NOT home
