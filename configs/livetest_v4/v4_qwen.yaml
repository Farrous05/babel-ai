fetcher_config:
  fetcher: "sharegpt"
  data_path: "data/seeds_unseen_hgh_500.json"   
  min_messages: 1
  max_messages: 6

analyzer_config:
  analyzer: "similarity"
  analyze_window: 10


agent_configs:
  - provider: "local_hf"                      # ← MODEL 1
    model: "/u/fash/internship-hpc-repo-template/models/end-token-A-qwen3b-v4"
    temperature: 1.0
    max_tokens: 512
    top_p: 0.95
  
  - provider: "local_hf"                      # ← MODEL 2 (same or different)
    model: "Qwen/Qwen2.5-3B-Instruct"
    system_prompt: "You are a helpful assistant participating in a conversation."
    temperature: 1.0
    max_tokens: 2048
    top_p: 0.95

# WHO STARTS? round_robin = alternate, first one in list goes first
agent_selection_method: "round_robin"

# HOW LONG?
history_window: 5
max_iterations: 28
max_total_characters: 1000000
output_dir: "/dais/fs/scratch/fash/results/v4_and_Qwen_3"
