# Long, low-temperature self-loop to trigger repetition-collapse.
# Low temp + no frequency penalty + many turns = the model should
# start looping the same phrasing: semantic_similarity -> high,
# perplexity -> low (more predictable).

fetcher_config:
  fetcher: "random"
  category: "conversational"

analyzer_config:
  analyzer: "similarity"
  analyze_window: 5

agent_configs:
  - provider: "openai"
    model: "gpt-4o-mini"
    system_prompt: "You are a helpful assistant participating in a conversation."
    temperature: 0.2          # near-deterministic -> easier to collapse
    max_tokens: 150
    frequency_penalty: 0.0    # do NOT discourage repetition
    presence_penalty: 0.0
    top_p: 1.0

agent_selection_method: "round_robin"

max_iterations: 60
max_total_characters: 1000000
output_dir: "results"
